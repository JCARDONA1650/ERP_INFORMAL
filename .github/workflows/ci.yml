name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Cancela ejecuciones anteriores de la misma rama cuando llega un commit nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Django + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp_informal
          POSTGRES_USER: erp_informal
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_informal -d erp_informal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Valores solo para CI: no son secretos reales.
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DJANGO_DEBUG: "0"
      POSTGRES_DB: erp_informal
      POSTGRES_USER: erp_informal
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Verificar que no falten migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: Verificar configuración de despliegue
        # BEHIND_PROXY/SSL_REDIRECT solo para este paso: con el resto del job
        # encendidos, el test client (http plano) recibiría 301 en todo.
        env:
          DJANGO_BEHIND_PROXY: "1"
          DJANGO_SSL_REDIRECT: "1"
        run: python manage.py check --deploy

      - name: Pruebas con cobertura
        run: |
          coverage run manage.py test --noinput
          coverage report --skip-empty
          coverage xml

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 14

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npx ng test --watch=false

      - name: Compilar para producción
        run: npx ng build
