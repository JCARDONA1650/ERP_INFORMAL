<main class="login">
  <section class="login__card" aria-labelledby="cp-title">
    <h1 id="cp-title" class="login__brand brand-row"><app-logo [size]="44" />INFORMAL <span>ERP</span></h1>
    <p class="login__subtitle">
      @if (forced()) { Tu contraseña es temporal: elige una nueva para continuar. } @else { Cambiar contraseña }
    </p>

    @if (error(); as message) {
      <p class="login__error" role="alert">{{ message }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="current">Contraseña actual</label>
        <input id="current" type="password" formControlName="current" autocomplete="current-password" />
      </div>
      <div class="field">
        <label for="next">Contraseña nueva</label>
        <input id="next" type="password" formControlName="next" autocomplete="new-password" />
        <span class="field__hint">Mínimo 8 caracteres; evita claves comunes o solo números.</span>
      </div>
      <div class="field">
        <label for="confirm">Repite la contraseña nueva</label>
        <input id="confirm" type="password" formControlName="confirm" autocomplete="new-password" />
      </div>

      <button class="btn btn--primary login__submit" type="submit" [disabled]="saving()">
        {{ saving() ? 'Guardando…' : 'Cambiar contraseña' }}
      </button>
    </form>

    @if (forced()) {
      <button class="btn btn--ghost login__submit" type="button" (click)="logout()">Cerrar sesión</button>
    } @else {
      <a class="btn btn--ghost login__submit" routerLink="/inicio">Cancelar</a>
    }
  </section>
</main>
