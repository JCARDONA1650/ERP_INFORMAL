<main class="login">
  <section class="login__card" aria-labelledby="login-title">
    <h1 id="login-title" class="login__brand">INFORMAL <span>ERP</span></h1>
    <p class="login__subtitle">Asistencia y nómina de obra</p>

    @if (error(); as message) {
      <p class="login__error" role="alert">{{ message }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="username">Usuario</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          autocomplete="username"
          autofocus
          [attr.aria-invalid]="form.controls.username.touched && form.controls.username.invalid"
        />
        @if (form.controls.username.touched && form.controls.username.invalid) {
          <span class="field__hint">Ingresa tu usuario.</span>
        }
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
        />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span class="field__hint">Ingresa tu contraseña.</span>
        }
      </div>

      <button class="btn btn--primary login__submit" type="submit" [disabled]="loading()">
        {{ loading() ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>
  </section>
</main>
