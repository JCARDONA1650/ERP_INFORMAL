<div class="shell">
  <aside class="shell__side">
    <a class="shell__brand brand-row" routerLink="/inicio"><app-logo [size]="32" />INFORMAL <span>ERP</span></a>
    <nav aria-label="Principal">
      @for (item of items(); track item.path) {
        <a [routerLink]="item.path" routerLinkActive="is-active">{{ item.label }}</a>
      }
    </nav>
  </aside>

  <div class="shell__main">
    <header class="shell__top">
      <div class="shell__user">
        <strong>{{ user()?.full_name }}</strong>
        <small>{{ user()?.roles?.join(' · ') }}</small>
      </div>
      <div class="shell__actions">
        <app-lang-switch />
        <a class="btn btn--ghost" routerLink="/cambiar-clave">Cambiar contraseña</a>
        <button class="btn btn--ghost" type="button" (click)="logout()">Cerrar sesión</button>
      </div>
    </header>

    <main class="shell__content">
      <router-outlet />
    </main>
    <app-footer />
  </div>
</div>
