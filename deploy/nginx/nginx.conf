# Si el proxy HTTPS de delante ya fijó X-Forwarded-Proto lo respeta; si no, usa el esquema local.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fotos de constancia de hasta 5 MB (+ margen del multipart).
    client_max_body_size 8m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── API y administración: las atiende Django ──
    # `^~` evita que la regla de archivos .js/.css de abajo capture rutas de estos prefijos.
    location ^~ /api/ {
        proxy_pass http://web:9000;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location ^~ /admin/ {
        proxy_pass http://web:9000;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # Estáticos del admin (whitenoise).
    location ^~ /static/ {
        proxy_pass http://web:9000;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # Las fotos NO se publican como archivos: solo salen por la API, con permisos.
    location ^~ /media/ {
        return 404;
    }

    # ── Frontend Angular ──
    # Archivos con hash en el nombre: se pueden cachear sin límite.
    location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html nunca se cachea: así un despliegue nuevo se ve de inmediato.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
