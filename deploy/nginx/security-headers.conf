# Cabeceras de seguridad del frontend. nginx no hereda add_header entre niveles,
# por eso este archivo se incluye en cada location que sirve archivos propios.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
# Angular inyecta <style> en tiempo de ejecución, de ahí 'unsafe-inline' solo en estilos.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
